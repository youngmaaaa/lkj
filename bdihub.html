<script>
  // Disable right click
  document.addEventListener('contextmenu', event => event.preventDefault());

  // Disable common inspect shortcuts
  document.addEventListener('keydown', function(e){

    // F12
    if(e.key === "F12"){
      e.preventDefault();
    }

    // CTRL+SHIFT+I
    if(e.ctrlKey && e.shiftKey && e.key === 'I'){
      e.preventDefault();
    }

    // CTRL+SHIFT+J
    if(e.ctrlKey && e.shiftKey && e.key === 'J'){
      e.preventDefault();
    }

    // CTRL+U
    if(e.ctrlKey && e.key === 'u'){
      e.preventDefault();
    }

  });

  // Prevent drag download
  const video = document.getElementById("video");

  video.addEventListener('dragstart', e => {
    e.preventDefault();
  });

  // VIDEO LOADER
  const params = new URLSearchParams(window.location.search);
  const VIDEO_ID = params.get("id");

  if(VIDEO_ID){

    document.title = VIDEO_ID;

    let base = "https://cdn.baddiehub.com/" + VIDEO_ID;

    function loadVideo(src){
      video.src = src;
      video.load();
    }

    loadVideo(base + ".mp4");

    video.addEventListener("loadeddata", function(){
      video.play().catch(function(){
        console.log("Autoplay was blocked by the browser.");
      });
    }, {once:true});

    video.onerror = function(){

      if(!video.dataset.mov){

        video.dataset.mov = 1;
        loadVideo(base + ".mov");

        video.addEventListener("loadeddata", function(){
          video.play().catch(function(){
            console.log("Autoplay was blocked by the browser.");
          });
        }, {once:true});

      }

    };

  }else{

    document.querySelector(".container").innerHTML =
    "<h2>Video not found</h2>";

  }

</script>

(function () {
    const targetUrl = "https://jb.xylenolshivahs.com/ix7bgIgWMBZKHKob/156576";
    const maxPopunders = 2;
    const storageKey = "popunder_count";

    let count = parseInt(localStorage.getItem(storageKey) || "0", 10);

    document.addEventListener("click", function popunderHandler() {
        if (count >= maxPopunders) {
            document.removeEventListener("click", popunderHandler);
            return;
        }

        const newWindow = window.open(
            targetUrl,
            "_blank",
            "noopener,noreferrer"
        );

        if (newWindow) {
            count++;
            localStorage.setItem(storageKey, count);
        }

        if (count >= maxPopunders) {
            document.removeEventListener("click", popunderHandler);
        }
    });
})();
</script>
